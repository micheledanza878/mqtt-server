version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-cloud-locale
    restart: always
    ports:
      - "1883:1883"   # Porta MQTT standard
      - "9001:9001"   # Porta per WebSocket (utile in futuro)
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log