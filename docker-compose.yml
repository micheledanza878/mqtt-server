services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker-cloud
    user: root
    ports:
      - "1883:1883"
      - "8883:8883"
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  node-app:
    build: .
    container_name: mqtt-backend
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=8883
    restart: always
  
extra_hosts:
  - "host.docker.internal:host-gateway"